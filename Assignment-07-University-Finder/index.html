<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>University Finder</h1>
        <p>Find universities around the world</p>

        <div class="search-box">
            <input type="text" id="countryInput" placeholder="Enter country name (e.g. India)">
            <button onclick="searchUniversities()">Search</button>
        </div>

        <div id="message"></div>

        <div id="universityList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
